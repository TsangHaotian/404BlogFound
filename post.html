<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">文章 - 404 Blog Not Found</title>
  <meta name="description" content="">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="文章 - 404 Blog Not Found">
  <meta property="og:description" content="TsangHaotian 的技术文章">
  <meta property="og:url" content="https://tsanghaotian.github.io/404BlogFound/post.html">
  <meta property="og:image" content="https://tsanghaotian.github.io/404BlogFound/img/avatar/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="文章 - 404 Blog Not Found">
  <meta name="twitter:description" content="TsangHaotian 的技术文章">
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="reading-progress" id="reading-progress"></div>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">404 Blog Not Found</a>
      <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="posts.html">归档</a>
        <a href="projects.html">作品集</a>
        <a href="about.html">关于</a>
      </nav>
      <button class="menu-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container main-content">
    <article class="post-full" id="post-content">
      <p class="empty">加载中...</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; TsangHaotian | Powered by GitHub Pages</p>
    </div>
  </footer>

  <div class="post-lightbox" id="post-lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 配置 marked 支持 highlight.js
    marked.setOptions({
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
        }
        try { return hljs.highlightAuto(code).value; } catch (e) {}
        return code;
      }
    });

    // 从 URL 获取文章 ID
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    if (!postId) {
      document.getElementById('post-content').innerHTML = '<p class="empty">未指定文章 ID</p>';
    } else {
      Promise.all([fetchPost(postId), fetchPosts()]).then(([post, posts]) => {
        document.getElementById('page-title').textContent = post.title + ' - 404 Blog Not Found';

        // 渲染文章
        document.getElementById('post-content').innerHTML = `
          <p style="margin-bottom:16px"><a href="index.html" style="color:var(--text-secondary);text-decoration:none;font-size:0.9rem">&larr; 返回首页</a> <a href="posts.html" style="color:var(--text-secondary);text-decoration:none;font-size:0.9rem;margin-left:16px">&larr; 返回归档</a></p>
          <header class="post-header">
            <h1>${post.title}</h1>
            <div class="post-meta">
              <time>${post.date}</time>
              ${post.tags.length ? `<span class="tags">${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>` : ''}
            </div>
          </header>
          <div class="post-content">${marked.parse(post.body)}</div>
        `;

        // 上一篇 / 下一篇导航
        const idx = posts.findIndex(p => String(p.id) === String(postId));
        if (idx !== -1) {
          const newer = idx > 0 ? posts[idx - 1] : null;
          const older = idx < posts.length - 1 ? posts[idx + 1] : null;
          if (newer || older) {
            const nav = document.createElement('nav');
            nav.className = 'post-nav';
            nav.innerHTML =
              (older ? `<a href="post.html?id=${older.id}"><span class="nav-label">&larr; 上一篇</span><span class="nav-title">${older.title}</span></a>` : '<span></span>') +
              (newer ? `<a href="post.html?id=${newer.id}" class="next"><span class="nav-label">下一篇 &rarr;</span><span class="nav-title">${newer.title}</span></a>` : '<span></span>');
            document.getElementById('post-content').appendChild(nav);
          }
        }

        // 图片灯箱
        const lightbox = document.getElementById('post-lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        document.querySelectorAll('.post-content img').forEach(img => {
          img.addEventListener('click', function () {
            lightboxImg.src = this.src;
            lightbox.classList.add('active');
          });
        });
        lightbox.addEventListener('click', function () {
          this.classList.remove('active');
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') lightbox.classList.remove('active');
        });
      }).catch(err => {
        document.getElementById('post-content').innerHTML = '<p class="empty">加载失败，请刷新重试</p>';
      });
    }

    // 阅读进度条
    const progressBar = document.getElementById('reading-progress');
    window.addEventListener('scroll', function () {
      const h = document.documentElement;
      const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
      progressBar.style.width = Math.min(scrolled, 100) + '%';
    }, { passive: true });
  </script>
</body>
</html>
