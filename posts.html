<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>归档 - 404 Blog Not Found</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="归档 - 404 Blog Not Found">
  <meta property="og:description" content="全部博客文章归档">
  <meta property="og:url" content="https://tsanghaotian.github.io/404BlogFound/posts.html">
  <meta property="og:image" content="https://tsanghaotian.github.io/404BlogFound/img/avatar/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="归档 - 404 Blog Not Found">
  <meta name="twitter:description" content="全部博客文章归档">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">404 Blog Not Found</a>
      <nav class="main-nav">
        <a href="index.html">首页</a>
        <a href="posts.html">归档</a>
        <a href="projects.html">作品集</a>
        <a href="about.html">关于</a>
      </nav>
      <button class="menu-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container main-content">
    <section class="archive">
      <h1>归档</h1>
      <input type="text" class="archive-search" id="archive-search" placeholder="搜索文章标题或简介...">
      <div id="post-list"><p class="empty">加载中...</p></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; TsangHaotian | Powered by GitHub Pages</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/liquid-glass.js"></script>
  <script>
    let allPosts = [];

    function renderPosts(posts) {
      const list = document.getElementById('post-list');
      if (!posts.length) {
        list.innerHTML = '<p class="empty">没有找到匹配的文章。</p>';
        return;
      }

      // 按年份分组
      const groups = {};
      posts.forEach(p => {
        const year = p.date.slice(0, 4);
        if (!groups[year]) groups[year] = [];
        groups[year].push(p);
      });
      const years = Object.keys(groups).sort((a, b) => b - a);

      list.innerHTML = years.map(year => `
        <div class="year-section">
          <h2 class="year-title">${year}<span class="year-count">${groups[year].length} 篇</span></h2>
          <div class="timeline">${groups[year].map(p => `
            <article class="post-card">
              <h3><a href="post.html?id=${p.id}">${p.title}</a></h3>
              <div class="post-meta">
                <time>${p.date}</time>
                ${p.tags.length ? `<span class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>` : ''}
              </div>
              <p class="post-excerpt">${p.description}</p>
            </article>
          `).join('')}</div>
        </div>
      `).join('');
    }

    fetchPosts().then(posts => {
      allPosts = posts;
      if (!posts.length) {
        document.getElementById('post-list').innerHTML = '<p class="empty">还没有文章，敬请期待。</p>';
        return;
      }
      renderPosts(posts);
    }).catch(() => {
      document.getElementById('post-list').innerHTML = '<p class="empty">加载失败，请刷新重试</p>';
    });

    // 搜索过滤
    document.getElementById('archive-search').addEventListener('input', function () {
      const kw = this.value.trim().toLowerCase();
      if (!kw) { renderPosts(allPosts); return; }
      renderPosts(allPosts.filter(p =>
        p.title.toLowerCase().includes(kw) ||
        (p.description || '').toLowerCase().includes(kw)
      ));
    });
  </script>
</body>
</html>
